name: m2_yolo26_bytetrack_smoke

detector:
  type: ultralytics_yolo
  model_path: yolo26n.pt
  imgsz: 960
  conf: 0.20
  iou: 0.70
  device: auto
  half: false
  coco_to_visdrone:
    0: 1
    2: 4
  allowed_classes: [1, 4]

tracker:
  type: bytetrack
  track_high_thresh: 0.25
  track_low_thresh: 0.10
  new_track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.80
  fuse_score: true

output:
  tracks_dir: outputs/tracks
  videos_dir: outputs/videos
